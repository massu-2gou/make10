<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メイク10パズル ゲーム</title>
<style>
  :root{--ink:#222;--line:#333;--ok:#1a7f37}
  *{box-sizing:border-box}
  body{margin:0;font-family:'UD デジタル 教科書体 N-R','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;color:var(--ink);background:#f6f4ee;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 40px}
  h1{font-size:24px;margin:6px 0 4px;text-align:center}
  .sub{text-align:center;font-size:15px;margin:0 0 12px}
  .levels{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  .levels button{font-size:20px;padding:8px 18px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;min-height:48px}
  .levels button.on{background:#222;color:#fff}
  .board{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 8px 16px}
  .info{text-align:center;font-size:17px;margin-bottom:6px;min-height:26px}
  .row{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:0;margin:10px 0}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .card{width:min(13vw,84px);height:min(13vw,84px);display:flex;align-items:center;justify-content:center;border:3px solid var(--line);border-radius:10px;font-size:min(9vw,48px);font-weight:bold;background:#fffdf2}
  .pb{width:min(13vw,84px);height:38px;border:2px dashed #888;border-radius:8px;background:#fff;font-size:22px;cursor:pointer;color:#444;line-height:1}
  .pb.has{border-style:solid;border-color:#222;background:#eef3ff;color:#000}
  .pb.hide,.hide{visibility:hidden}
  .nohide{display:block}
  .op{width:min(10vw,60px);height:min(10vw,60px);margin:0 min(1vw,6px);border:3px dashed #555;border-radius:50%;background:#fff;font-size:min(7.5vw,34px);cursor:pointer;color:#000;font-weight:bold}
  .op.set{border-style:solid;background:#fff6dd}
  .opwrap{display:flex;align-items:center;margin-top:44px}
  .opwrap.p3{margin-top:0}
  .expr{font-size:min(7vw,32px);text-align:center;margin:12px 0 4px;min-height:44px;font-weight:bold;word-break:break-all}
  .result{font-size:min(6vw,26px);text-align:center;min-height:36px}
  .result.ok{color:var(--ok);font-weight:bold}
  .result.ng{color:#a40e26}
  .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .ctrl button{font-size:19px;padding:10px 18px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;min-height:48px}
  .ctrl button.next{background:#1a7f37;color:#fff;border-color:#1a7f37}
  .msg{text-align:center;margin-top:10px;font-size:18px;min-height:28px}
  .score{text-align:center;font-size:16px;margin-top:10px}
  .rule{margin-top:14px;background:#fff;border:1px dashed #777;border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.6}
  button:focus-visible{outline:3px solid #06c}
</style>
</head>
<body>
<div class="wrap">
  <h1>メイク10パズル</h1>
  <p class="sub">数のならびはそのまま。まるをおして + − × ÷ を入れて、答えを 10 にしよう!</p>
  <div class="levels" id="levels"></div>
  <div class="board">
    <div class="info" id="info"></div>
    <div class="row" id="row"></div>
    <div class="expr" id="expr"></div>
    <div class="result" id="result"></div>
    <div class="ctrl">
      <button id="hint">ヒント</button>
      <button id="reset">やりなおし</button>
      <button id="show">こたえを見る</button>
      <button id="next" class="next">つぎの問題 ▶</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="score" id="score"></div>
  <div class="rule">
    <b>あそびかた</b><br>
    ・数のあいだの まる をおすと、+ → − → × → ÷ とかわります。<br>
    ・× と ÷ は、+ と − より先に計算します。<br>
    ・★★★ では、数のうえの「( 」と、下の「 )」もおせます。( ) の中が先に計算されます。<br>
    ・答えが 10 になったらクリア! ほかの式でも正かいです。
  </div>
</div>
<script>
const DATA={"1": [{"n": [5, 8, 3, 6], "a": "5+8+3−6"}, {"n": [6, 9, 4, 9], "a": "6+9+4−9"}, {"n": [5, 1, 1, 3], "a": "5+1+1+3"}, {"n": [5, 6, 5, 6], "a": "5+6+5−6"}, {"n": [4, 9, 3, 6], "a": "4+9+3−6"}, {"n": [3, 5, 4, 2], "a": "3+5+4−2"}, {"n": [6, 4, 5, 3], "a": "6−4+5+3"}, {"n": [9, 1, 2, 4], "a": "9−1−2+4"}, {"n": [5, 6, 3, 2], "a": "5+6−3+2"}, {"n": [4, 1, 4, 9], "a": "4+1−4+9"}, {"n": [9, 3, 5, 9], "a": "9−3−5+9"}, {"n": [6, 3, 1, 2], "a": "6+3−1+2"}, {"n": [1, 7, 6, 4], "a": "1+7+6−4"}, {"n": [9, 3, 3, 7], "a": "9−3−3+7"}], "2": [{"n": [8, 8, 5, 2], "a": "8÷8×5×2"}, {"n": [3, 6, 6, 8], "a": "3−6÷6+8"}, {"n": [4, 4, 7, 1], "a": "4×4−7+1"}, {"n": [2, 8, 1, 6], "a": "2×8−1×6"}, {"n": [4, 4, 3, 2], "a": "4+4×3÷2"}, {"n": [3, 6, 4, 4], "a": "3×6−4−4"}, {"n": [9, 8, 4, 1], "a": "9+8÷4−1"}, {"n": [2, 5, 6, 2], "a": "2+5+6÷2"}, {"n": [2, 7, 4, 1], "a": "2×7−4×1"}, {"n": [2, 8, 4, 6], "a": "2+8÷4+6"}, {"n": [9, 3, 4, 3], "a": "9÷3+4+3"}, {"n": [6, 4, 4, 2], "a": "6−4+4×2"}, {"n": [2, 4, 6, 3], "a": "2+4×6÷3"}, {"n": [5, 3, 6, 9], "a": "5×3×6÷9"}, {"n": [5, 9, 9, 4], "a": "5+9÷9+4"}, {"n": [7, 6, 1, 3], "a": "7+6−1×3"}], "3": [{"n": [8, 9, 3, 6], "a": "8+(9+3)÷6"}, {"n": [3, 2, 1, 1], "a": "3×(2+1)+1"}, {"n": [9, 8, 3, 7], "a": "(9−8)×3+7"}, {"n": [6, 8, 4, 7], "a": "6÷(8÷4)+7"}, {"n": [3, 4, 1, 9], "a": "3÷(4−1)+9"}, {"n": [3, 9, 3, 9], "a": "3÷(9÷3)+9"}, {"n": [6, 5, 9, 5], "a": "(6+5−9)×5"}, {"n": [1, 2, 2, 2], "a": "(1+2+2)×2"}, {"n": [9, 8, 8, 8], "a": "(9×8+8)÷8"}, {"n": [3, 2, 1, 7], "a": "3+(2−1)×7"}, {"n": [6, 8, 2, 9], "a": "6÷(8−2)+9"}, {"n": [1, 1, 1, 4], "a": "(1+1)×(1+4)"}, {"n": [1, 7, 4, 8], "a": "(1+7)÷4+8"}, {"n": [8, 5, 8, 4], "a": "8×5÷(8−4)"}]};
const OPS=['+','−','×','÷'];
let lv=1, order=[], idx=0, cur=null, st=null, cleared={1:0,2:0,3:0}, shown=false, hinted=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newOrder(){order=shuffle(DATA[lv].map((_,i)=>i));idx=0}
function load(){
  cur=DATA[lv][order[idx]];
  st={ops:[-1,-1,-1],open:[0,0,0,0],close:[0,0,0,0],done:false};
  shown=false;hinted=false;
  document.getElementById('msg').textContent='';
  render();
}
// ---- 式の計算(小数・分数もそのまま計算し、10かどうかを判定する) ----
function buildTokens(){
  const t=[];
  for(let i=0;i<4;i++){
    for(let k=0;k<st.open[i];k++)t.push('(');
    t.push(cur.n[i]);
    for(let k=0;k<st.close[i];k++)t.push(')');
    if(i<3)t.push(st.ops[i]<0?null:OPS[st.ops[i]]);
  }
  return t;
}
function evalTokens(t){
  if(t.some(x=>x===null))return {err:'incomplete'};
  let p=0;
  function peek(){return t[p]}
  function expr(){let v=term();if(v===null)return null;
    while(peek()==='+'||peek()==='−'){const o=t[p++];const r=term();if(r===null)return null;v=o==='+'?v+r:v-r}
    return v}
  function term(){let v=factor();if(v===null)return null;
    while(peek()==='×'||peek()==='÷'){const o=t[p++];const r=factor();if(r===null)return null;
      if(o==='÷'){if(r===0)return null;v=v/r}else v=v*r}
    return v}
  function factor(){const x=t[p];
    if(typeof x==='number'){p++;return x}
    if(x==='('){p++;const v=expr();if(v===null)return null;if(t[p]!==')')return null;p++;return v}
    return null}
  const v=expr();
  if(v===null||p!==t.length)return {err:'bad'};
  return {v};
}
function evalString(s){ // 答えの文字列を判定(テスト用)
  const t=[];for(const ch of s){if(/[0-9]/.test(ch))t.push(Number(ch));else t.push(ch)}
  return evalTokens(t);
}
function fmt(v){return Number.isInteger(v)?String(v):String(Math.round(v*1000)/1000)}
function exprText(){
  return buildTokens().map(x=>x===null?'○':x).join(' ').replace(/\( /g,'(').replace(/ \)/g,')');
}
function render(){
  document.getElementById('info').textContent='';
  const levelsEl=document.getElementById('levels');levelsEl.innerHTML='';
  [['★',1],['★★',2],['★★★',3]].forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l+(cleared[v]?'  ('+cleared[v]+')':'');b.className=v===lv?'on':'';b.onclick=()=>{lv=v;newOrder();load()};levelsEl.appendChild(b)});
  const row=document.getElementById('row');row.innerHTML='';
  const paren=lv===3;
  for(let i=0;i<4;i++){
    const col=document.createElement('div');col.className='col';
    const ob=document.createElement('button');ob.className='pb'+(paren?'':' hide')+(st.open[i]?' has':'');
    ob.textContent=st.open[i]?'('.repeat(st.open[i]):'(';ob.setAttribute('aria-label','左かっこ');
    ob.onclick=()=>{st.open[i]=(st.open[i]+1)%3;update()};
    const card=document.createElement('div');card.className='card';card.textContent=cur.n[i];
    const cb=document.createElement('button');cb.className='pb'+(paren?'':' hide')+(st.close[i]?' has':'');
    cb.textContent=st.close[i]?')'.repeat(st.close[i]):')';cb.setAttribute('aria-label','右かっこ');
    cb.onclick=()=>{st.close[i]=(st.close[i]+1)%3;update()};
    col.append(ob,card,cb);row.appendChild(col);
    if(i<3){
      const w=document.createElement('div');w.className='opwrap'+(paren?'':' p3');
      if(!paren)w.style.marginTop='0';
      const b=document.createElement('button');b.className='op'+(st.ops[i]>=0?' set':'');
      b.textContent=st.ops[i]>=0?OPS[st.ops[i]]:'';b.setAttribute('aria-label','きごう');
      b.onclick=()=>{st.ops[i]=(st.ops[i]+1)%4;update()};
      w.appendChild(b);row.appendChild(w);
    }
  }
  document.getElementById('hint').style.display='';
  document.getElementById('score').textContent='クリアした数: ★ '+cleared[1]+'　★★ '+cleared[2]+'　★★★ '+cleared[3];
  update(true);
}
function update(skipRender){
  const r=evalTokens(buildTokens());
  const ex=document.getElementById('expr'),res=document.getElementById('result');
  ex.textContent=exprText()+(r.err?'':' ＝ '+fmt(r.v));
  res.className='result';
  if(r.err){res.textContent=r.err==='incomplete'?'○に + − × ÷ を入れよう':'かっこの形をたしかめよう';}
  else if(Math.abs(r.v-10)<1e-9){res.textContent='やったね! 10になったよ!';res.className='result ok';
    if(!st.done&&!shown){st.done=true;cleared[lv]++;document.getElementById('score').textContent='クリアした数: ★ '+cleared[1]+'　★★ '+cleared[2]+'　★★★ '+cleared[3];
      const lb=document.querySelectorAll('#levels button');lb.forEach((b,i)=>{const v=i+1;b.textContent=['★','★★','★★★'][i]+(cleared[v]?'  ('+cleared[v]+')':'')});}
  }
  else{res.textContent='いまは '+fmt(r.v)+' だよ。10にしよう';res.className='result ng';}
  if(!skipRender){
    document.querySelectorAll('.pb').forEach(()=>{});
    refreshButtons();
  }
}
function refreshButtons(){
  const row=document.getElementById('row');
  const cols=row.querySelectorAll('.col');
  cols.forEach((col,i)=>{
    const [ob,,cb]=col.children;
    ob.textContent=st.open[i]?'('.repeat(st.open[i]):'(';ob.classList.toggle('has',!!st.open[i]);
    cb.textContent=st.close[i]?')'.repeat(st.close[i]):')';cb.classList.toggle('has',!!st.close[i]);
  });
  row.querySelectorAll('.op').forEach((b,i)=>{b.textContent=st.ops[i]>=0?OPS[st.ops[i]]:'';b.classList.toggle('set',st.ops[i]>=0)});
}
document.getElementById('reset').onclick=()=>{st.ops=[-1,-1,-1];st.open=[0,0,0,0];st.close=[0,0,0,0];update()};
document.getElementById('next').onclick=()=>{idx++;if(idx>=order.length)newOrder();load()};
document.getElementById('show').onclick=()=>{shown=true;document.getElementById('msg').textContent='れい: '+cur.a+' ＝ 10(ほかの式でも正かいです)'};
document.getElementById('hint').onclick=()=>{
  hinted=true;const a=cur.a;
  const m=a.match(/\((\d+)([+−×÷])(\d+)/);
  const first=a.replace(/[0-9()]/g,'')[0];
  document.getElementById('msg').textContent=(lv===3&&m)?'ヒント: 「'+m[1]+'」と「'+m[3]+'」を ( ) でかこんで、先に計算してみよう':'ヒント: いちばん左の○は「'+first+'」だよ';
};
newOrder();load();
window.__test={DATA,evalString};
</script>
</body>
</html>
